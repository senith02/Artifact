# Reference workflow — run the Repo What-If Report in CI (DL-033 R3-I; DL-037 §7).
#
# Manual trigger only. It replays this repository's completed runs of one
# workflow through the advisor and uploads the Markdown, JSON and static HTML
# report as a workflow artifact. Demonstration only — never research evidence.
# Not exercised in P4-T3, where the reports were generated locally.
name: carbon-whatif

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow file to replay (e.g. ci.yml)
        required: true
        default: ci.yml

permissions:
  contents: read
  actions: read

jobs:
  whatif:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: senith02/Artifact
          ref: <full-commit-sha>
          path: advisor-src
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the advisor's pinned runtime subset
        run: >-
          python -m pip install --disable-pip-version-check --no-deps --only-binary=:all:
          -r advisor-src/Research_Artifact/code/github-action/requirements.action.txt
      - name: Repo What-If Report
        working-directory: advisor-src/Research_Artifact/code
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WHATIF_REPO: ${{ github.repository }}
          WHATIF_WORKFLOW: ${{ inputs.workflow }}
          WHATIF_OUT: ${{ runner.temp }}/whatif
        run: >-
          python -m advisor whatif --repo "$WHATIF_REPO" --workflow "$WHATIF_WORKFLOW" --fetch
          --snapshot "$WHATIF_OUT/snapshot.json" --out "$WHATIF_OUT/report"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carbon-whatif-report
          path: ${{ runner.temp }}/whatif/report/
