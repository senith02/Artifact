# Reference workflow — the Repo What-If Report from the same Action (DL-033 R3-I; DL-038 §5).
#
# Manual trigger only. It replays this repository's completed runs of one workflow
# through the advisor on GB compute (labelled SCENARIO), writes the report into the
# run summary, and uploads the Markdown, JSON and static HTML as a workflow artifact.
# Demonstration only, never research evidence.
#
# This replaces the earlier hand-written form (clone, install, call the CLI), which
# first ran in CI on 2026-10-16 in senith02/carbon-advisor-demo (run 38890789432).
name: carbon-whatif

on:
  workflow_dispatch:
    inputs:
      workflow:
        description: Workflow file to replay (e.g. ci.yml)
        required: true
        default: ci.yml

permissions:
  actions: read

jobs:
  whatif:
    runs-on: ubuntu-24.04
    steps:
      - uses: senith02/Artifact/Research_Artifact/code/github-action@<full-commit-sha>
        with:
          mode: whatif
          workflow: ${{ inputs.workflow }}
