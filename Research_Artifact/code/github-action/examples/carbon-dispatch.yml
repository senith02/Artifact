# Reference workflow — the re-dispatch dispatcher (DL-033 R3-C10; DL-038 §6, §11).
#
# It reads the open `carbon-deferral` issues, dispatches each one that is due, then
# comments on and closes it. A failed dispatch leaves the issue open, so a deferral
# is never dropped. Past arrival + 26 h it dispatches anyway ("deadline reached").
#
# What starts it:
#   - workflow_dispatch: the punctual path. vps-trigger/carbon_tick.py (or any
#     external cron) starts it at the exact due time, because deferral times are
#     always on the hour.
#   - schedule: a slow BACKUP only. GitHub's schedule is best-effort; on 2026-10-21/22
#     an hourly schedule ran 3 times in 12 hours. It runs only on the default branch
#     and is disabled in a public repository after 60 days without activity.
name: carbon-dispatch

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

# Never two passes at once, so a deferral cannot be dispatched twice in a race.
concurrency:
  group: carbon-dispatch
  cancel-in-progress: false

permissions:
  actions: write                    # dispatch the deferred workflow runs
  issues: write                     # comment on and close the deferral issues

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: senith02/Artifact/Research_Artifact/code/github-action@<full-commit-sha>
        with:
          mode: dispatch
