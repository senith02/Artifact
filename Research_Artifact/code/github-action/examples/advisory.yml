# Reference workflow — the one-job setup (DL-038 §2).
#
# Add the `carbon-advisor` job to your existing CI workflow. Nothing else is needed:
# no config file and no checkout. The job's inputs are the team config, and the
# workflow the job sits in is the one advised. It publishes a recommendation in the
# run summary, a notice on the run page, and job outputs. It never blocks the build.
#
# Do NOT skip the build on `action == 'defer'` with this workflow alone: nothing here
# re-runs a skipped build later. To skip and re-run deferred builds, use
# redispatch.yml + carbon-dispatch.yml instead.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  carbon-advisor:
    runs-on: ubuntu-24.04
    steps:
      - uses: senith02/Artifact/Research_Artifact/code/github-action@<full-commit-sha>
        with:
          compute-region: GB          # where your build runs: declared by you, never detected
          # show-gb-scenario: true    # on a non-GB runner, also show the labelled GB answer
          # urgent-markers: "[urgent], [hotfix]"
          # extra-protected-branches: "develop, staging/*"
          # max-delay-hours: 12

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "your build here"
