[project]
name = "carbon-scheduler"
version = "0.0.1"
description = "Selective carbon-aware scheduling for CI/CD pipelines: an empirical decision model from commit-level SE characteristics (BSc research artifact)"
requires-python = ">=3.11"
# Runtime dependencies are managed in requirements.txt / requirements.lock.txt
# (spec §3.2 stack). This pyproject.toml carries package metadata + tool config.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scheduler_core", "replay"]

[tool.pytest.ini_options]
# Run pytest from the code/ directory; make the package importable without an
# editable install.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
